<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Babel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 mb-3">Biblioteca de Babel</h1>
            <p class="lead text-muted fst-italic">
                A biblioteca está dividida em câmaras hexagonais, cada uma com 4 paredes de estantes, 
                cinco prateleiras por parede e 32 volumes por prateleira.
            </p>
        </header>

        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Explorar</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="buscar.html">Buscar</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="sobre.html">Sobre a biblioteca</a>
            </li>
        </ul>

            <div>
                <div class="card mb-4">
                    <div class="card-body">
                        <label class="form-label">Digite o texto que deseja encontrar</label>
                        <textarea class="form-control mb-3" id="textoBusca" rows="3" 
                            placeholder="Qualquer texto que você imaginar..."></textarea>
                        
                        <button class="btn btn-primary" onclick="buscar()">Procurar</button>
                    </div>
                </div>

                <div id="resultado" class="card" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">Encontrado!</h5>
                        <p class="font-monospace" id="coordenadas"></p>
                        <button class="btn " id="irPara">Ver Página</button>
                    </div>
                </div>
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
